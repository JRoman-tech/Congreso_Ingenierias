spring.application.name=gestion-participantes-api
server.port=${PORT:3001}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:congreso_participantes}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Mexico_City
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.upload-dir=${UPLOAD_DIR:uploads}

server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
