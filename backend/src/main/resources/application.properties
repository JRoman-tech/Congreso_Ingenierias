spring.application.name=congreso-ingenierias-api
server.port=${PORT:3001}

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:congreso_participantes}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Mexico_City
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.upload-dir=${UPLOAD_DIR:uploads}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
